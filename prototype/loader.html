<!doctype html><meta charset="utf-8"><title>loader variations</title>
<style>
body{margin:0;padding:40px;background:#fff;color:#1c1c1a;
 font:12px "Avenir Next Condensed","Avenir Next",Helvetica,Arial,sans-serif;
 letter-spacing:.04em}
h1{font:inherit;opacity:.5;margin:0 0 32px;text-transform:uppercase}
h2{font:inherit;margin:0 0 4px;text-transform:uppercase}
h2 small{opacity:.5;text-transform:none;letter-spacing:0}
.row{border-top:1px solid rgba(0,0,0,.12);padding:18px 0 22px}
.strip{display:flex;align-items:center;gap:18px;margin-top:14px}
.cell{display:flex;flex-direction:column;align-items:center;gap:7px}
.cell em{font-style:normal;opacity:.35;font-size:10px}
canvas{display:block}
.live{margin-left:26px;padding-left:26px;border-left:1px solid rgba(0,0,0,.12)}
</style>
<h1>loader variations — small, snappy, built from tanh (not committed)</h1>
<div id="out"></div>
<script>
const INK = "#1c1c1a";
const S = 44;                     // actual size: 44px, vs the 180px orbital
const tanh = Math.tanh;

// ---- L1 · the curve draws itself, then clears -----------------------
function sweep(ctx, t, s) {
  const p = (t % 1);
  const ease = p < 0.75 ? p / 0.75 : 1;          // draw fast, hold, reset
  const fade = p < 0.75 ? 1 : 1 - (p - 0.75) / 0.25;
  const pad = s * 0.16, span = s - pad * 2, n = 26;
  ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.lineCap = "round";
  ctx.globalAlpha = fade;
  ctx.beginPath();
  for (let i = 0; i <= n * ease; i++) {
    const u = i / n, x = pad + u * span;
    const y = s / 2 - tanh((u - 0.5) * 5.2) * (s / 2 - pad);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// ---- L2 · a bar that fills with tanh easing — saturating, not linear -
function saturate(ctx, t, s) {
  const p = (t % 1);
  const k = p < 0.8 ? tanh((p / 0.8) * 2.6) / tanh(2.6) : 1;
  const fade = p < 0.8 ? 1 : 1 - (p - 0.8) / 0.2;
  const pad = s * 0.14, span = s - pad * 2, y = s / 2;
  ctx.globalAlpha = 0.18; ctx.fillStyle = INK;
  ctx.fillRect(pad, y - 1, span, 2);
  ctx.globalAlpha = fade; ctx.fillRect(pad, y - 1, span * k, 2);
  ctx.globalAlpha = 1;
}

// ---- L3 · sampled ticks, a tanh step scrolling through --------------
function sampled(ctx, t, s) {
  const n = 9, pad = s * 0.14, span = s - pad * 2;
  const shift = (t % 1) * 8 - 4;
  ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.lineCap = "round";
  for (let i = 0; i < n; i++) {
    const u = i / (n - 1);
    const x = pad + u * span;
    const v = (tanh((u - 0.5) * 6 + shift) + 1) / 2;      // 0..1
    const h = 2 + v * (s * 0.52);
    ctx.globalAlpha = 0.35 + v * 0.65;
    ctx.beginPath();
    ctx.moveTo(x, s / 2 + h / 2);
    ctx.lineTo(x, s / 2 - h / 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// ---- L4 · three dots, a tanh pulse passing through ------------------
function pulse(ctx, t, s) {
  const n = 3, gap = s * 0.22;
  for (let i = 0; i < n; i++) {
    const phase = ((t * 1.6) - i * 0.18) % 1;
    const bell = Math.max(0, Math.sin(phase * Math.PI));
    const k = tanh(bell * 2.2) / tanh(2.2);
    const x = s / 2 + (i - (n - 1) / 2) * gap;
    ctx.globalAlpha = 0.3 + k * 0.7;
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.arc(x, s / 2, 2 + k * 2.6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

const VARIANTS = [
  ["L1 · curve sweep", "the tanh curve draws itself — 0.9s", sweep, 0.9],
  ["L2 · saturating bar", "fills with tanh easing: fast, then settles — 0.8s", saturate, 0.8],
  ["L3 · sampled ticks", "a tanh step scrolling through samples — 1.0s", sampled, 1.0],
  ["L4 · pulse", "a tanh pulse passing through three dots — 0.7s", pulse, 0.7],
];

const out = document.getElementById("out");
VARIANTS.forEach(([name, note, fn, dur]) => {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = `<h2>${name} <small>— ${note}</small></h2>`;
  const strip = document.createElement("div");
  strip.className = "strip";

  // filmstrip: six moments across one cycle
  [0, .17, .34, .5, .67, .84].forEach((f) => {
    const cell = document.createElement("div");
    cell.className = "cell";
    const c = document.createElement("canvas");
    const dpr = 2; c.width = S * dpr; c.height = S * dpr;
    c.style.width = c.style.height = S + "px";
    const ctx = c.getContext("2d"); ctx.scale(dpr, dpr);
    fn(ctx, f, S);
    cell.appendChild(c);
    const em = document.createElement("em"); em.textContent = f.toFixed(2);
    cell.appendChild(em);
    strip.appendChild(cell);
  });

  // and one running live
  const live = document.createElement("div");
  live.className = "cell live";
  const lc = document.createElement("canvas");
  const dpr = 2; lc.width = S * dpr; lc.height = S * dpr;
  lc.style.width = lc.style.height = S + "px";
  const lctx = lc.getContext("2d"); lctx.scale(dpr, dpr);
  live.appendChild(lc);
  const le = document.createElement("em"); le.textContent = "live";
  live.appendChild(le);
  strip.appendChild(live);
  (function loop(ts) {
    requestAnimationFrame(loop);
    lctx.clearRect(0, 0, S, S);
    fn(lctx, (ts || 0) / 1000 / dur, S);
  })(0);

  row.appendChild(strip);
  out.appendChild(row);
});
</script>
