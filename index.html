<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!--
            The ground the browser paints its own chrome with — the phone's
            status bar and the address bar behind it. It is one tag rather than
            two `prefers-color-scheme` variants because the site deliberately
            does not consult the OS: only a stored choice moves it, so the value
            has to be set from that choice rather than matched by a media query.

            The two grounds are `--background` in tokens.css. This tag carries
            its own copy because the script below runs before any stylesheet
            exists; build.ts fails the build if the two drift apart.
        -->
        <meta name="theme-color" content="#fff" data-light="#fff" data-dark="#1c1c1a" />

        <!--
            The theme, before first paint.

            Blocking and inline, which is the whole point: `dist/index.html`
            carries the pre-rendered page and its stylesheet inline, so it is
            painted long before the bundle has parsed. Adopting the stored
            choice from the store's `hydrate` — where it used to happen alone —
            meant a returning dark-theme visitor watched the entire document
            render white and then invert.

            The key is the one useThemeStore.ts persists under.
        -->
        <script>
            (function () {
                var theme = "light";
                try {
                    var saved = localStorage.getItem("tanh-theme");
                    if (saved === "light" || saved === "dark") theme = saved;
                } catch (error) {
                    // Private browsing denies access to localStorage outright.
                }
                document.documentElement.dataset.theme = theme;
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute("content", meta.dataset[theme]);
            })();
        </script>

        <title>tanh lab — audio software agency</title>
        <meta
            name="description"
            content="Audio software agency in Berlin. Plug-in development, real-time DSP and machine learning for audio."
        />
        <link rel="canonical" href="https://tanh-lab.com/" />

        <meta property="og:type" content="website" />
        <meta property="og:title" content="tanh lab — audio software agency" />
        <meta
            property="og:description"
            content="Audio software agency in Berlin. Plug-in development, real-time DSP and machine learning for audio."
        />
        <meta property="og:url" content="https://tanh-lab.com/" />
        <meta property="og:image" content="https://tanh-lab.com/brand/card-social.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:site_name" content="tanh lab" />
        <!-- British spelling throughout the copy — "notarisation", not "-zation". -->
        <meta property="og:locale" content="en_GB" />
        <meta name="twitter:card" content="summary_large_image" />
        <!--
            Described for anyone whose reader announces the card rather than
            showing it. Both spellings of the property: Slack, LinkedIn and
            Facebook read the og one, X reads its own.
        -->
        <meta
            property="og:image:alt"
            content="The tanh lab lockup: the studio name above the words audio software agency."
        />
        <meta
            name="twitter:image:alt"
            content="The tanh lab lockup: the studio name above the words audio software agency."
        />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="./src/main.tsx"></script>
    </body>
</html>
