<!--
  The tanh lab wordmark, as outlines.

  Letterforms, not live text: an SVG that named its faces would fall back to
  Times on any machine without them, which for a logo is a different logo. Made
  from the site's own woff2 by setting the text in Chrome, printing it to PDF and
  letting poppler turn the glyphs into paths.

  The two lines are set to one measure, the short title large and the long
  subtitle small, which is the relationship src/ui/wordmark-fit.ts maintains on
  the site. Regenerate only if the typefaces change. Ink is #E8E8E6; the
  -light file is the same paths at #E8E8E6, for dark grounds.
-->
