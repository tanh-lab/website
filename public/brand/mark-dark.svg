<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!--
    The mark on the dark theme's ground, for /ci/ and nothing else.

    Not a favicon and not linked from any page. favicon.svg stays the mark: it
    is one piece of artwork that carries its own ground in both themes, and a
    tab that swapped between two of them would be showing two logos rather than
    one in two states. This is the asset a dark deck or a dark profile reaches
    for, offered as a download beside the other one.

    The ground is the site's own dark hero, rendered from the shader in
    src/shader rather than approximated: the purple palette, uninverted, at the
    settings the dark theme presets.

    It is a crop of that render rather than the whole of it, which is the part
    that took a while to find. Rendered whole into a square, the flare puts its
    core and both lobes inside the mark, and the result carries about two and a
    half times the curvature of the light ground — which reads as a different
    piece of artwork rather than the same one after dark. A 700px window taken
    near the corner of a 1600px render comes out at 0.67 against the light
    ground's 0.58: a smooth corner-to-corner gradient of the kind the light mark
    carries, rather than a flare with a core in it.

    Its tonal spread is wider — 103 levels against 61 — and is meant to be. The
    light ground sits in the top fifth of the range, where a gentle gradient is
    all it takes to read; a dark one starts from near-black and needs the
    distance to show at all.

    That is also the likeliest reason the fit in tools/render-brand.ts failed at
    28/255. It fitted the whole flare to the whole ground; if the light artwork
    is itself a window onto a much larger render, no whole-frame fit was ever
    going to close.

    Chroma is pulled back to 70% in Oklab. Less than that and a dark field takes
    the colour out of it entirely; more and the flare's core reads as a vivid
    magenta beside a light mark now at a fifth of the chroma it started with.
    Carried at 96px like the other ground, downsampled after the grade so the
    banding a dark gradient picks up averages out rather than being baked in.

    The swash is favicon.svg's path, at the width it is baked at there. It is
    the same curve; only what is behind it changes.
  -->
  <image width="800" height="800" preserveAspectRatio="none" href="data:image/png;base64,"/>
