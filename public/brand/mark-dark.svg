<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!--
    The mark on the dark theme's ground, for /ci/ and nothing else.

    Not a favicon and not linked from any page. favicon.svg stays the mark: it
    is one piece of artwork that carries its own ground in both themes, and a
    tab that swapped between two of them would be showing two logos rather than
    one in two states. This is the asset a dark deck or a dark profile reaches
    for, offered as a download beside the other one.

    The ground is the site's own dark hero, rendered from the shader in
    src/shader rather than approximated: the purple palette, uninverted, at the
    settings the dark theme presets.

    It is a crop of that render, and matched to the light ground rather than
    merely darkened. Both took finding, because the obvious measures are the
    wrong ones. Rendered whole into a square, the flare puts its core and both
    lobes inside the mark and plainly reads as a shader — but grey levels say
    almost nothing about that, since the same span of them is far more visible
    starting from black than from white. The two figures that do say something
    are in Oklab:

      Perceptual lightness spread. The light ground covers L 0.70-0.86, a
      spread of 0.158. The whole flare covered 0.310 — twice as much variation
      to see, which is what "you can make out the shader" is.

      Planarity. The light ground is nearly a plane: fit one to its L and the
      residual is 13% of its spread. A flare with a core in it is not, whatever
      its spread has been compressed to, and a bright corner survives any amount
      of flattening.

    So the crop is chosen by the second and then remapped by the first: a 500px
    window at (880, 880) of a 1600px render, which fits a plane to within 10%,
    with its L mapped into a spread of 0.158 starting at #1c1c1a's own lightness
    so the mark sits on the theme's ground rather than above it. Its chroma is
    remapped the same way, into the 0.028-0.068 the light ground covers, so the
    colour varies across the square by as much there as it does here and no
    more.

    And it is turned through 180 degrees. The light ground gathers its colour in
    the bottom-right corner and gives up the top-left; the crop did the reverse,
    which is a small thing that reads immediately as two different pictures when
    the two are seen together.

    That is also the likeliest reason the fit in tools/render-brand.ts failed at
    28/255. It fitted the whole flare to the whole ground; if the light artwork
    is itself a window onto a much larger render, no whole-frame fit was ever
    going to close.

    Carried at 96px like the other ground, downsampled after the grade so the
    banding a dark gradient picks up averages out rather than being baked in.

    The swash is favicon.svg's path, at the width it is baked at there. It is
    the same curve; only what is behind it changes.
  -->
