<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!--
    The site's own artwork, at icon size: the shader's magenta ground with the
    tanh curve drawn over it as a translucent white swash.

    Two layers, because the source is two things. The ground is a shader render
    with no closed form — it is not a linear or radial gradient, and every
    attempt to approximate it as one came out flat and far too pale, so it is
    carried as a small raster and scaled up. Smooth enough that 96px is
    indistinguishable from the 800px original once resampled; larger buys
    nothing and only inflates a file that wants to stay inlineable.

    The swash is the path Figma exported, so it stays sharp at any size a tab,
    bookmark or pinned icon asks for — which is the half of the mark that has
    an edge worth keeping. It sits at 50% over the ground exactly as in the
    source, and the ground beneath it was recovered by undoing that composite
    rather than by painting over it, so the gradient continues underneath
    unbroken.

    The ground's chroma is pulled back to 55% of what the source artwork
    carried, in Oklab rather than by fading toward white. Fading washes the
    swash out along with the ground, since lightness is the only thing that
    separates them; scaling chroma alone leaves every lightness untouched, so
    the curve keeps exactly the contrast it had while the magenta stops
    shouting. /ci/ carries a slider over the same transform, for settling on a
    different number.

    No prefers-color-scheme variant: the mark is fixed artwork, and it carries
    its own ground in both themes.
  -->
