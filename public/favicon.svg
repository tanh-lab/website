<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!--
    The site's own artwork, at icon size: the shader's magenta ground with the
    tanh curve drawn over it as a translucent white swash.

    Two layers, because the source is two things. The ground is a shader render
    with no closed form — it is not a linear or radial gradient, and every
    attempt to approximate it as one came out flat and far too pale, so it is
    carried as a small raster and scaled up. Smooth enough that 96px is
    indistinguishable from the 800px original once resampled; larger buys
    nothing and only inflates a file that wants to stay inlineable.

    The swash is the path Figma exported, taken to 0.45 of the width it was
    drawn at. It stays curves rather than a traced outline, so it is as sharp at any
    size a tab, bookmark or pinned icon asks for as the export was; /ci/ carries
    the control that thinned it, and reads 1.00 as what is here. It sits at 50%
    over the ground exactly as in the source, and the ground beneath it was
    recovered by undoing that composite rather than by painting over it, so the
    gradient continues underneath unbroken — the thinner curve simply shows more
    of it.

    The ground is graded in Oklab rather than faded toward white. Fading washes
    the swash out along with the ground, since lightness is the only thing that
    separates them; working in Oklab leaves every lightness untouched, so the
    curve keeps exactly the contrast it had at any colour. Three passes have
    been baked in, each settled on with the /ci/ sliders and then written here
    so nobody has to carry the numbers: 55% of the chroma the source render
    carried, then 70% of that when it still read too pink beside the wordmark,
    then 55% again together with a hue turned -39 degrees, which is what took it
    off magenta altogether. It sits at 0.21 of the source's chroma, near 292
    degrees in Oklch — a violet rather than the blue that number sounds like.
    /ci/ carries sliders over the same transform, and reads them all at rest as
    what is here.

    No prefers-color-scheme variant: the mark is fixed artwork, and it carries
    its own ground in both themes.
  -->
