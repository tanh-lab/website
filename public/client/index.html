<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Client area — tanh lab</title>
        <meta name="description" content="The tanh lab client area is not open yet." />
        <!-- Nothing to index here, and nothing that should outrank the site. -->
        <meta name="robots" content="noindex" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

        <link
            rel="preload"
            as="font"
            type="font/woff2"
            href="/fonts/barlow-semi-condensed-latin-400-normal.woff2"
            crossorigin
        />
        <link
            rel="preload"
            as="font"
            type="font/woff2"
            href="/fonts/instrument-serif-latin-400-normal.woff2"
            crossorigin
        />

        <!--
            A plain document, deliberately: it carries no bundle, no shader and
            no React, so it is one request plus its two faces. That is also why
            the tokens below are copied from src/styles/tokens.css rather than
            imported — the site's stylesheet is content-hashed at build time and
            has no stable URL this file could point at. Only the handful of
            values this page actually paints are duplicated; if the palette
            moves, it moves here too.
        -->
        <style>
            @font-face {
                font-family: "Barlow Semi Condensed";
                src: url("/fonts/barlow-semi-condensed-latin-400-normal.woff2")
                    format("woff2");
                font-weight: 400;
                font-style: normal;
                font-display: swap;
            }

            @font-face {
                font-family: "Barlow Semi Condensed";
                src: url("/fonts/barlow-semi-condensed-latin-200-italic.woff2")
                    format("woff2");
                font-weight: 200;
                font-style: italic;
                font-display: swap;
            }

            @font-face {
                font-family: "Instrument Serif";
                src: url("/fonts/instrument-serif-latin-400-normal.woff2")
                    format("woff2");
                font-weight: 400;
                font-style: normal;
                font-display: swap;
            }

            :root {
                --background: #fff;
                --text-positive: #1c1c1a;
                --rule: rgba(28, 28, 26, 0.16);

                --gutter: clamp(24px, 4.45vw, 88px);
                --serif: "Instrument Serif", "Times New Roman", Times, serif;
                --ui:
                    "Barlow Semi Condensed", "Avenir Next Condensed",
                    "Helvetica Neue", Arial, sans-serif;
                --ease: cubic-bezier(0.22, 1, 0.36, 1);
            }

            html[data-theme="dark"] {
                --background: #1c1c1a;
                --text-positive: #e8e8e6;
                --rule: rgba(232, 232, 230, 0.22);
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            html {
                -webkit-font-smoothing: antialiased;
                background: var(--background);
                font-size: 10px;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                padding: calc(var(--gutter) * 0.9) var(--gutter);
                gap: 2rem;
                font-family: var(--ui);
                font-weight: 400;
                color: var(--text-positive);
                background: var(--background);
            }

            a {
                color: inherit;
                text-decoration: none;
            }

            :focus-visible {
                outline: 2px solid currentColor;
                outline-offset: 3px;
            }

            .brand {
                font-family: var(--serif);
                font-size: 20px;
                line-height: 1;
                transition: opacity 0.25s var(--ease);
            }

            .brand:hover {
                opacity: 0.62;
            }

            /* The block sits on the same optical line the sections' leads do:
               left on the gutter, a little above centre. */
            main {
                flex: 1;
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding-bottom: 6vh;
            }

            .label {
                margin: 0 0 1.4rem;
                font-size: 14px;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                opacity: 0.55;
            }

            h1 {
                margin: 0 0 1.8rem;
                font-family: var(--serif);
                font-weight: 400;
                font-size: clamp(38px, 7vw, 96px);
                line-height: 1;
                letter-spacing: -0.01em;
            }

            .lead {
                margin: 0;
                max-width: 48ch;
                font-size: clamp(16px, 2.2vh, 19px);
                line-height: 1.5;
            }

            .lead + .lead {
                margin-top: 1rem;
            }

            .lead a {
                /* The address is one object: broken across a line the rule
                   under it reads as two separate links. */
                white-space: nowrap;
                border-bottom: 1px solid var(--rule);
                padding-bottom: 1px;
                transition: border-color 0.25s var(--ease);
            }

            .lead a:hover {
                border-color: currentColor;
            }

            footer {
                padding-top: 1.4rem;
                border-top: 1px solid var(--rule);
                font-size: 14px;
            }

            footer a {
                opacity: 0.9;
                transition: opacity 0.25s var(--ease);
            }

            footer a:hover {
                opacity: 1;
            }
        </style>

        <!--
            Runs before first paint, so a visitor who chose dark on the site
            does not get a white flash on the way in.

            Same key and same rule as src/store/useThemeStore.ts: only a stored
            choice moves the theme, and everything else is light. There is no
            toggle on this page — it has no shader and no state of its own to
            keep, so the site stays the one place the choice is made.
        -->
        <script>
            try {
                var saved = localStorage.getItem("tanh-theme");
                if (saved === "light" || saved === "dark") {
                    document.documentElement.dataset.theme = saved;
                }
            } catch (e) {
                // Private browsing denies localStorage outright; the bare
                // :root palette is the light theme, so the page still paints.
            }
        </script>
    </head>
    <body>
        <a class="brand" href="/">tanh lab</a>

        <main>
            <p class="label">Client area</p>
            <h1>Coming soon.</h1>
            <p class="lead">
                The client area is not open yet. It will hold project builds,
                test reports and delivery notes for work in progress.
            </p>
            <p class="lead">
                Until it opens, everything runs over email —
                <a href="mailto:contact@tanh-lab.com">contact@tanh-lab.com</a>.
            </p>
        </main>

        <footer>
            <a href="/">&larr; Back to the site</a>
        </footer>
    </body>
</html>
